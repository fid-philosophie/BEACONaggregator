# docker-compose.yml – BEACONaggregator standalone
#
# Usage:
#   docker compose build
#   docker compose run --rm beaconaggregator
#
# Output lands in ./data/ on the host (timestamped subdirs created by the pipeline).
# This file can also be referenced from a BEACONradar root compose that
# runs both beaconlist and beaconaggregator sharing a common data volume.

services:
  beaconaggregator:
    build:
      context: .
      dockerfile: Dockerfile
    image: beaconaggregator:latest
    volumes:
      # Shared data dir. The pipeline writes beacons_<timestamp>/, aggregations/,
      # split_aggregations/, merged/ etc. here.
      - ./data:/data
    # One-shot job, not a long-running service.
    restart: "no"
